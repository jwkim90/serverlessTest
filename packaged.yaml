Description: SAM template for ApplicationCostMonitoring ACM-S3-Publisher
Parameters:
  RemoveCostAllocationTags:
    Default: 'false'
    Type: String
    Description: If cost allocation tags should be removed. Set to "true" to enable.
      Needed for Athena.
AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Resources:
  S3BillingItemWriterS3Bucket:
    Type: AWS::S3::Bucket
    Metadata:
      SamResourceId: S3BillingItemWriterS3Bucket
  S3Publisher:
    Type: AWS::Serverless::Function
    Properties:
      Description: Write billing data to an S3 bucket
      MemorySize: 128
      Environment:
        Variables:
          ARCHIVE_S3_BUCKET_NAME:
            Ref: S3BillingItemWriterS3Bucket
          LOG_LEVEL: INFO
          S3_PREFIX: ApplicationCostMonitoring/line_items
          REMOVE_COST_ALLOCATION_TAGS:
            Ref: RemoveCostAllocationTags
      Handler: handlers/s3-billing-item-writer.handler
      Timeout: 15
      CodeUri: s3://testjinwoo9089/89e729ea9a1816ee67023062c14ca48f
      Runtime: python3.11
      Policies:
      - S3CrudPolicy:
          BucketName:
            Ref: S3BillingItemWriterS3Bucket
    Metadata:
      SamResourceId: S3Publisher
Outputs:
  S3BillingItemWriterBucketName:
    Description: S3 bucket where billing line items are delivered to.
    Value:
      Ref: S3BillingItemWriterS3Bucket
    Export:
      Name: ACM-S3-Publisher-S3BillingItemWriterBucketName
Metadata:
  AWS::ServerlessRepo::Application:
    Name: my-app
    Description: hello world
    Author: user1
    SpdxLicenseId: Apache-2.0
    LicenseUrl: s3://testjinwoo9089/d41d8cd98f00b204e9800998ecf8427e
    ReadmeUrl: s3://testjinwoo9089/1c950aeaff63c58dd8cd05a20fc51351
    Labels:
    - tests
    HomePageUrl: https://github.com/user1/my-app-project
    SemanticVersion: '0.0.1'
    SourceCodeUrl: https://github.com/user1/my-app-project
